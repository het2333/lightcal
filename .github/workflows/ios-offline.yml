name: iOS offline flows
on:
  push:
    branches: [main, feat/qwen-personal-key]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - name: Run local persistence and Qwen tests
        run: swift test
      - name: Test real iOS flows without a backend
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for r,a in d["devices"].items() for v in a if "iOS-26" in r and v["name"].startswith("iPhone 17 Pro")))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b > /tmp/lightcal-boot.log 2>&1 &
          xcodebuild test -project ios/CalAI.xcodeproj -scheme OfflineTests -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath /tmp/lightcal-offline-build -resultBundlePath /tmp/lightcal-offline.xcresult -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- ONLY_ACTIVE_ARCH=YES ARCHS="$(uname -m)"
      - name: Export test results and screenshots
        if: always()
        run: |
          mkdir -p offline-test-results
          xcrun xcresulttool export attachments --path /tmp/lightcal-offline.xcresult --output-path offline-test-results || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-results
          path: offline-test-results
