name: Capture current UI
on:
  push:
    branches: [docs/capture-current-ui]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated demo backend
        run: |
          python -m pip install -r requirements.txt
          python -m uvicorn server:app --host 127.0.0.1 --port 18018 > /tmp/lightcal-backend.log 2>&1 &
          for n in {1..30}; do curl -fsS http://127.0.0.1:18018/ && break || sleep 1; done
          python ScreenshotsTests/seed.py
      - name: Prepare screenshot test target
        run: |
          gem install --user-install xcodeproj --no-document
          ruby ScreenshotsTests/prepare.rb
      - name: Capture screenshots from the current app
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for r,a in d["devices"].items() for v in a if "iOS-26" in r and v["name"].startswith("iPhone 17 Pro")))')
          echo "$DEVICE_ID" > /tmp/lightcal-device.txt
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcodebuild test -project ios/CalAI.xcodeproj -scheme Screenshots -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath /tmp/lightcal-build -resultBundlePath /tmp/lightcal-shots.xcresult -parallel-testing-enabled NO CODE_SIGN_IDENTITY=-
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p exported-screenshots
          xcrun xcresulttool export attachments --path /tmp/lightcal-shots.xcresult --output-path exported-screenshots || true
          xcrun simctl list devices --json > exported-screenshots/devices.json
          cp /tmp/lightcal-backend.log exported-screenshots/backend.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-ui-screenshots
          path: exported-screenshots
